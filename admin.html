<style>
:root{
  --deep:#27523E;
  --deep-2:#173C2C;
  --cream:#F6F7ED;
  --mist:#E8ECE1;
  --sand:#EBE7DA;
  --sage:#B7C9A7;
  --sage-ink:#729060;
  --btn:#D9E1D4;
  --clay:#96562F;
  --clay-soft:#D9A07A;
  --star:#B96A3F;
  --ink:#1E3328;
  --muted:#5A665A;
  --line:rgba(39,82,62,.16);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Roboto",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{
  margin:0;
  font-family:var(--sans);
  font-size:1.0625rem;
  line-height:1.7;
  color:var(--ink);
  background:var(--cream);
  overflow-x:hidden;
}
img,svg,iframe{max-width:100%}
a{color:inherit}
h1,h2,h3,p,ul,address{margin:0}
ul{padding:0;list-style:none}
address{font-style:normal}
:focus-visible{outline:3px solid var(--clay-soft);outline-offset:3px;border-radius:6px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.container{width:100%;max-width:1120px;margin-inline:auto;padding-inline:20px}
section[id]{scroll-margin-top:12px}

/* ---------- Type helpers ---------- */
.eyebrow{
  margin-bottom:20px;
  font-size:.78rem;font-weight:700;line-height:1.3;
  letter-spacing:.17em;text-transform:uppercase;
  color:var(--clay);
}
.eyebrow.light{color:var(--sage)}
.title{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(2.3rem,10.8vw,3.9rem);
  line-height:1.04;letter-spacing:-.02em;
  color:var(--ink);overflow-wrap:break-word;
}
.title em{display:block;font-style:italic;color:var(--sage-ink)}
.title.light{color:var(--cream)}
.title.light em{color:var(--sage)}
.lead{margin-top:28px;max-width:44ch;color:var(--muted)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  min-height:54px;padding:0 26px;
  border:1px solid transparent;border-radius:999px;
  font:inherit;font-size:1rem;font-weight:700;line-height:1.2;text-align:center;text-decoration:none;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease;
}
.btn .ic{width:22px;height:22px}
.btn-light{background:var(--btn);color:var(--deep)}
.btn-light:hover{background:#E9EFE5}
.btn-line{border-color:rgba(255,255,255,.38);color:#fff}
.btn-line:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.6)}

/* ---------- Header ---------- */
.site-header{position:relative;z-index:20;background:var(--deep);color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;min-height:76px;padding-block:12px}
.brand{display:inline-flex;align-items:center;gap:16px;text-decoration:none;color:#fff;min-width:0}
.logo{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:50px;height:52px;border-radius:52% 52% 52% 14%;
  background:#D8E5D8;font-family:var(--serif);font-size:1.75rem;line-height:1;letter-spacing:-.06em;color:var(--deep);
}
.logo span+span{color:#4E7D5B;margin-top:-.32em}
.brand-text{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-text strong{font-size:1.1rem;font-weight:700}
.brand-text small{font-size:.78rem;letter-spacing:.17em;text-transform:uppercase;color:#A9BDB0}

.nav-toggle{
  display:none;width:48px;height:48px;margin-right:-10px;
  align-items:center;justify-content:center;
  background:none;border:0;border-radius:12px;color:#fff;cursor:pointer;
}
.js .nav-toggle{display:inline-flex}
.bars{position:relative;width:26px;height:18px}
.bars i{position:absolute;left:0;width:100%;height:2px;border-radius:2px;background:currentColor;transition:transform .2s ease,opacity .2s ease,top .2s ease}
.bars i:nth-child(1){top:0}
.bars i:nth-child(2){top:8px}
.bars i:nth-child(3){top:16px}
.nav-toggle[aria-expanded="true"] .bars i:nth-child(1){top:8px;transform:rotate(45deg)}
.nav-toggle[aria-expanded="true"] .bars i:nth-child(2){opacity:0}
.nav-toggle[aria-expanded="true"] .bars i:nth-child(3){top:8px;transform:rotate(-45deg)}

.nav{width:100%;padding-top:6px}
.nav ul{display:flex;flex-wrap:wrap;gap:0 18px}
.nav a{display:block;padding:8px 2px;color:#D3E0D5;text-decoration:none;font-weight:500}
.nav a:hover{color:#fff}

.js .nav{
  display:none;
  position:absolute;top:100%;left:0;right:0;
  padding:6px 20px 22px;
  background:var(--deep-2);
  border-bottom:1px solid rgba(255,255,255,.12);
  box-shadow:0 26px 40px -24px rgba(0,0,0,.5);
}
.js .nav.open{display:block}
.js .nav ul{display:block}
.js .nav a{
  display:flex;align-items:center;min-height:58px;padding:0 2px;
  font-family:var(--serif);font-size:1.6rem;color:var(--cream);
  border-bottom:1px solid rgba(255,255,255,.1);
}
.js .nav li:last-child a{border-bottom:0}

/* ---------- Hero ---------- */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background-color:var(--deep);
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px);
  background-size:30px 30px;
}
.hero-grid{display:grid;gap:44px;padding-top:56px;padding-bottom:64px}
.hero-line{
  display:flex;align-items:center;gap:14px;margin-bottom:26px;
  font-size:.78rem;font-weight:700;letter-spacing:.17em;text-transform:uppercase;line-height:1.3;
  color:var(--clay-soft);
}
.hero-line::before{content:"";width:40px;height:1px;background:currentColor;flex:none}
.hero h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(2.5rem,12.4vw,5.6rem);
  line-height:1.02;letter-spacing:-.02em;
  color:var(--cream);overflow-wrap:break-word;
}
.hero h1 em{display:block;font-style:italic;color:var(--sage)}
.hero-sub{margin-top:30px;max-width:26ch;font-size:1.25rem;line-height:1.6;color:#BFD0C3}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:38px}
.hero-actions .btn{flex:1 1 auto;padding:0 20px;gap:10px}
.hero-place{display:flex;align-items:center;gap:12px;margin-top:34px;font-size:.95rem;color:#A9BDB0}
.hero-place::before{content:"";width:9px;height:9px;border-radius:50%;background:#C8734A;flex:none}
.hero-art{width:min(100%,300px);margin-inline:auto}
.hero-art svg{display:block;width:100%;height:auto}

/* ---------- About ---------- */
.section{padding:84px 0}
.about{background:var(--cream)}
.sec-num{display:flex;align-items:center;gap:16px;margin-bottom:26px;font-size:.95rem;font-weight:700;color:var(--clay)}
.sec-num::after{content:"";width:60px;height:1px;background:var(--line)}
.about-copy p{margin-top:32px;max-width:58ch;font-size:1.1rem;line-height:1.75;color:var(--muted)}
.text-link{
  display:inline-flex;align-items:center;gap:12px;
  margin-top:34px;padding:8px 32px 14px 0;
  font-weight:700;color:var(--deep);text-decoration:none;
  border-bottom:1px solid var(--line);
}
.text-link .ic{width:20px;height:20px}
.text-link:hover{border-bottom-color:var(--deep)}

/* ---------- Services ---------- */
.services{background:var(--mist)}
.cards{display:grid;gap:18px;margin-top:48px}
.card{
  position:relative;display:flex;flex-direction:column;
  padding:28px;border:1px solid rgba(39,82,62,.08);border-radius:8px;
  background:var(--cream);color:var(--ink);
}
.card.dark{background:var(--deep);border-color:var(--deep);color:#fff}
.card-top{display:flex;align-items:flex-start;justify-content:space-between}
.ico{
  display:flex;align-items:center;justify-content:center;
  width:48px;height:48px;border-radius:50%;background:var(--btn);color:var(--deep);
}
.dark .ico{background:rgba(255,255,255,.14);color:#fff}
.num{font-size:.8rem;font-weight:700;color:var(--clay)}
.dark .num{color:var(--clay-soft)}
.card h3{margin-top:40px;font-family:var(--serif);font-weight:400;font-size:1.75rem;line-height:1.15;letter-spacing:-.01em}
.card p{margin-top:10px;max-width:26ch;color:var(--muted)}
.dark p{color:#C3D3C7}
.card-arrow{
  align-self:flex-end;margin-top:18px;
  display:flex;align-items:center;justify-content:center;
  width:42px;height:42px;border:1px solid var(--line);border-radius:50%;
  color:var(--deep);text-decoration:none;
  transition:background-color .2s ease;
}
.card-arrow::after{content:"";position:absolute;inset:0;border-radius:8px}
.card-arrow .ic{width:18px;height:18px}
.card-arrow:hover{background:var(--btn)}
.dark .card-arrow{border-color:rgba(255,255,255,.4);color:#fff}
.dark .card-arrow:hover{background:rgba(255,255,255,.12)}

/* ---------- Produtos ---------- */
.products{background:var(--cream)}
.products-head{display:grid;gap:18px}
.products-tools{margin-top:34px;display:grid;gap:12px}
.products-search{width:100%;min-height:52px;padding:0 18px;border:1px solid rgba(39,82,62,.16);border-radius:999px;background:#fff;color:var(--ink);font:inherit;outline:none}
.products-search:focus{border-color:var(--deep);box-shadow:0 0 0 3px rgba(39,82,62,.08)}
.category-list{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.category-btn{flex:0 0 auto;border:1px solid rgba(39,82,62,.16);background:var(--cream);color:var(--deep);border-radius:999px;padding:9px 15px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
.category-btn.active,.category-btn:hover{background:var(--deep);color:#fff;border-color:var(--deep)}
.products-count{margin-top:8px;color:var(--muted);font-size:.9rem}
.products-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px}
.product-card{
  display:flex;flex-direction:column;overflow:hidden;
  border:1px solid rgba(39,82,62,.12);border-radius:12px;
  background:#fff;box-shadow:0 18px 40px -30px rgba(23,60,44,.45);
}
.product-photo{
  aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  background:var(--mist);color:var(--sage-ink);font-family:var(--serif);
  font-size:1.2rem;
}
.product-info{padding:15px}.product-info h3{font-size:1.25rem}.product-info p{font-size:.88rem;line-height:1.45}.product-price{margin-top:11px;font-size:1rem}
.product-info h3{font-family:var(--serif);font-weight:400;color:var(--ink)}
.product-info p{margin-top:7px;color:var(--muted)}
.product-price{display:block;font-weight:700;color:var(--deep)}
.product-empty{
  margin-top:48px;padding:42px 24px;text-align:center;
  border:1px dashed rgba(39,82,62,.25);border-radius:12px;
  background:var(--mist);
}
.product-empty h3{font-family:var(--serif);font-size:1.7rem;font-weight:400;color:var(--deep)}
.product-empty p{margin-top:10px;color:var(--muted)}
.product-empty .btn{margin-top:24px}
.products-more{display:flex;justify-content:center;margin-top:24px}
.products-more button{border:1px solid var(--deep);background:transparent;color:var(--deep);border-radius:999px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
.products-more button:hover{background:var(--deep);color:#fff}

/* ---------- Reviews ---------- */
.reviews{background:var(--cream)}
.rating-grid{display:grid;gap:40px}
.stars{display:flex;gap:10px}
.stars svg{width:28px;height:28px;fill:var(--star)}
.score{margin-top:22px;display:flex;align-items:baseline;gap:6px;font-family:var(--serif);color:var(--ink)}
.score strong{font-weight:400;font-size:4.6rem;line-height:1;letter-spacing:-.03em}
.score span{font-size:1.25rem;color:var(--muted)}
.count{margin-top:10px;color:var(--muted)}
.rating hr{margin:30px 0;border:0;border-top:1px solid var(--line)}
.rating-note{font-size:.95rem;color:var(--muted)}
.quote{font-family:var(--serif);font-style:italic;font-size:1.45rem;line-height:1.4;color:var(--deep)}
.quote-by{margin-top:14px;color:var(--muted)}

/* ---------- Location ---------- */
.location{background:var(--sand)}
.place{display:grid;grid-template-columns:auto 1fr;column-gap:16px;margin-top:44px;align-items:start}
.place .ic{width:28px;height:28px;color:var(--clay);margin-top:1px}
.place strong{font-size:1.1rem;font-weight:500;color:var(--deep);line-height:1.5}
.place address{grid-column:2;margin-top:8px;color:var(--muted);line-height:1.9}
.location .btn{margin-top:32px}
.map-card{
  display:block;padding:14px;border-radius:4px;background:var(--cream);
  box-shadow:0 30px 60px -32px rgba(23,60,44,.5);
}
.map-card svg{display:block;width:100%;height:auto}
.loc-map{margin-top:44px}

/* ---------- Contact ---------- */
.contact{background:var(--deep);color:#fff}
.contact-list{display:grid;gap:18px;margin-top:40px}
.contact-list a{display:inline-flex;align-items:center;gap:16px;width:fit-content;max-width:100%;font-size:1.15rem;color:#E4ECE4;text-decoration:none;overflow-wrap:anywhere}
.contact-list a:hover{color:#fff}
.contact-list .ic{width:26px;height:26px;color:var(--sage)}
.contact .btn{margin-top:38px}

/* ---------- Footer ---------- */
.site-footer{background:var(--deep-2);color:#B4C6B9;padding:44px 0 32px}
.footer-grid{display:grid;gap:26px}
.site-footer address{line-height:1.8}
.f-links{display:flex;gap:26px}
.f-links a{display:inline-block;padding:8px 0;color:#E4ECE4;text-decoration:none}
.f-links a:hover{color:#fff;text-decoration:underline}
.copy{margin-top:34px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);font-size:.92rem;color:#8FA698}
.copy p+p{margin-top:8px}

/* ---------- Tablet / desktop ---------- */
@media (min-width:560px){
  .hero-actions .btn{flex:0 0 auto;padding:0 26px;gap:12px}
}

@media (min-width:900px){
  .container{padding-inline:40px}
  section[id]{scroll-margin-top:0}
  .header-inner{flex-wrap:nowrap;min-height:88px}
  .nav-toggle,.js .nav-toggle{display:none}
  .nav,.js .nav{display:block;position:static;width:auto;padding:0;background:none;border:0;box-shadow:none}
  .nav ul,.js .nav ul{display:flex;gap:4px}
  .nav a,.js .nav a{display:block;min-height:0;padding:10px 14px;font-family:var(--sans);font-size:.98rem;font-weight:500;color:#D3E0D5;border:0;border-radius:999px}
  .nav a:hover{background:rgba(255,255,255,.08);color:#fff}

  .hero-grid{grid-template-columns:1.15fr .85fr;gap:64px;align-items:center;padding-top:88px;padding-bottom:104px}
  .hero-art{width:min(100%,440px)}
  .hero-sub{font-size:1.35rem}
  .hero h1{font-size:clamp(3.2rem,5.2vw,4.9rem)}

  .section{padding:120px 0}
  .title{font-size:clamp(2.6rem,4.2vw,3.8rem)}
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start}
  .about-copy p{margin-top:0;padding-top:14px}
  .products-tools{grid-template-columns:1fr;gap:14px}
  .products-search{max-width:620px}
  .services-head{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end}
  .services-head .lead{margin-top:0}
  .cards{grid-template-columns:repeat(3,1fr);gap:24px;margin-top:64px}
  .products-head{grid-template-columns:1fr 1fr;gap:80px;align-items:end}
  .products-grid{grid-template-columns:repeat(4,1fr);gap:20px;margin-top:34px}
  .card{padding:32px;min-height:320px}
  .card h3{margin-top:auto;padding-top:56px}
  .rating-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
  .loc-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:80px;align-items:center}
  .loc-map{margin-top:0}
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
  .contact-list{margin-top:0}

  .footer-grid{grid-template-columns:1.2fr 1fr auto;align-items:center;gap:48px}
  .footer-grid .f-links{justify-content:flex-end}
}
</style>

<style> .admin-section{background:var(--mist);min-height:100vh}.admin-box{max-width:760px;margin:44px auto 0;padding:28px;background:var(--cream);border:1px solid rgba(39,82,62,.12);border-radius:14px;box-shadow:0 22px 55px -35px rgba(23,60,44,.55)}.admin-box h3{font-family:var(--serif);font-size:2rem;font-weight:400;color:var(--deep)}.admin-note{margin-top:8px;color:var(--muted)}.admin-login{display:grid;gap:12px;margin-top:24px}.admin-login input,.admin-form input,.admin-form textarea{width:100%;padding:14px 16px;border:1px solid rgba(39,82,62,.2);border-radius:10px;background:#fff;color:var(--ink);font:inherit}.admin-form{display:grid;gap:14px;margin-top:24px}.admin-form label{font-weight:700;color:var(--deep)}.admin-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}.admin-list{display:grid;gap:12px;margin-top:30px}.admin-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border:1px solid rgba(39,82,62,.12);border-radius:10px;background:#fff}.admin-item strong{color:var(--deep)}.admin-item small{display:block;color:var(--muted);margin-top:3px}.admin-item button{border:1px solid rgba(39,82,62,.2);border-radius:999px;padding:9px 13px;background:var(--cream);color:var(--deep);font:inherit;font-weight:700;cursor:pointer}.admin-item button.danger{color:#8b3f2c}.admin-status{margin-top:12px;color:var(--muted);font-size:.92rem}@media (min-width:700px){.admin-form{grid-template-columns:1fr 1fr}.admin-form .full{grid-column:1/-1}}</style>
</head>
<body>
<section class="section admin-section" id="painel">
  <div class="container">
    <div class="admin-box">
      <p class="eyebrow">Área administrativa</p>
      <h1 class="title" style="font-size:clamp(2.1rem,8vw,3.2rem)">Painel do <em>dono.</em></h1>
      <p class="admin-note">Adicione e gerencie os produtos do catálogo.</p>
      <div id="admin-login-wrap">
        <form class="admin-login" id="admin-login">
          <input id="admin-password" type="password" placeholder="Senha do painel" autocomplete="current-password" required>
          <button class="btn btn-light" type="submit">Entrar no painel</button>
        </form>
        <p class="admin-status" id="login-status"></p>
      </div>
      <div id="admin-content" hidden>
        <form class="admin-form" id="product-form">
          <div><label for="product-name">Nome do produto</label><input id="product-name" required placeholder="Ex.: Castanha de caju"></div>
          <div><label for="product-price">Preço</label><input id="product-price" required placeholder="Ex.: R$ 29,90"></div>
          <div><label for="product-category">Categoria</label><input id="product-category" placeholder="Ex.: Chás, vitaminas, suplementos..."></div>
          <div class="full"><label for="product-image">Foto (URL da imagem)</label><input id="product-image" type="url" placeholder="https://..."></div>
          <div class="full"><label for="product-description">Descrição</label><textarea id="product-description" rows="3" placeholder="Descrição curta do produto"></textarea></div>
          <div class="admin-actions full"><button class="btn btn-light" type="submit" id="save-product">Adicionar produto</button><button class="btn btn-line" type="button" id="cancel-edit" style="display:none">Cancelar edição</button><button class="btn btn-line" type="button" id="logout-admin">Sair</button></div>
        </form>
        <p class="admin-status" id="admin-status"></p><div class="admin-list" id="admin-list"></div>
      </div>
    </div>
  </div>
</section>
<script>
(function(){
  var STORAGE_KEY='pesosMedidasProdutos', ADMIN_PASSWORD='1234', logged=false, editingId=null;
  function loadProducts(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return[]}}
  function saveProducts(x){localStorage.setItem(STORAGE_KEY,JSON.stringify(x))}
  function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
  function renderAdmin(){var list=document.getElementById('admin-list'),ps=loadProducts();list.innerHTML='';if(!ps.length){list.innerHTML='<p class="admin-status">Nenhum produto cadastrado.</p>';return}ps.forEach(function(p){var item=document.createElement('div');item.className='admin-item';item.innerHTML='<div><strong>'+esc(p.name)+'</strong><small>'+esc(p.price)+(p.soldOut?' · ESGOTADO':' · Disponível')+(p.category?' · '+esc(p.category):'')+'</small></div><div class="admin-actions"><button data-action="toggle" data-id="'+esc(p.id)+'">'+(p.soldOut?'Reativar':'Esgotado')+'</button><button data-action="edit" data-id="'+esc(p.id)+'">Editar</button><button class="danger" data-action="delete" data-id="'+esc(p.id)+'">Excluir</button></div>';list.appendChild(item)})}
  function setLogged(v){logged=v;document.getElementById('admin-login-wrap').hidden=v;document.getElementById('admin-content').hidden=!v;if(v)renderAdmin()}
  document.getElementById('admin-login').addEventListener('submit',function(e){e.preventDefault();var st=document.getElementById('login-status');if(document.getElementById('admin-password').value===ADMIN_PASSWORD){st.textContent='';document.getElementById('admin-password').value='';setLogged(true)}else st.textContent='Senha incorreta.'});
  document.getElementById('product-form').addEventListener('submit',function(e){e.preventDefault();if(!logged)return;var ps=loadProducts(),d={name:document.getElementById('product-name').value.trim(),price:document.getElementById('product-price').value.trim(),image:document.getElementById('product-image').value.trim(),description:document.getElementById('product-description').value.trim(),category:document.getElementById('product-category').value.trim()};if(editingId)ps=ps.map(function(p){return p.id===editingId?Object.assign({},p,d):p});else{d.id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);d.soldOut=false;ps.unshift(d)}saveProducts(ps);editingId=null;this.reset();document.getElementById('save-product').textContent='Adicionar produto';document.getElementById('cancel-edit').style.display='none';document.getElementById('admin-status').textContent='Produto salvo neste dispositivo.';renderAdmin()});
  document.getElementById('admin-list').addEventListener('click',function(e){var b=e.target.closest('button[data-action]');if(!b)return;var id=b.dataset.id,a=b.dataset.action,ps=loadProducts(),p=ps.find(function(x){return x.id===id});if(!p)return;if(a==='delete'){if(confirm('Excluir "'+p.name+'"?'))saveProducts(ps.filter(function(x){return x.id!==id}))}else if(a==='toggle'){p.soldOut=!p.soldOut;saveProducts(ps)}else if(a==='edit'){editingId=id;document.getElementById('product-name').value=p.name||'';document.getElementById('product-price').value=p.price||'';document.getElementById('product-image').value=p.image||'';document.getElementById('product-description').value=p.description||'';document.getElementById('product-category').value=p.category||'';document.getElementById('save-product').textContent='Salvar alterações';document.getElementById('cancel-edit').style.display='inline-flex';return}renderAdmin()});
  document.getElementById('cancel-edit').addEventListener('click',function(){editingId=null;document.getElementById('product-form').reset();document.getElementById('save-product').textContent='Adicionar produto';this.style.display='none'});
  document.getElementById('logout-admin').addEventListener('click',function(){setLogged(false)});
})();
</script>
</body>
</html>
