<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#183c2b">
  <title>Status do pedido | Pesos e Medidas</title>
  <style>
    body{margin:0;background:#f5f7f1;color:#183c2b;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:grid;min-height:100vh;place-items:center;padding:20px;box-sizing:border-box}.card{width:min(520px,100%);background:#fff;border:1px solid #dfe5dd;border-radius:22px;padding:28px;box-shadow:0 18px 45px #183c2b10;text-align:center}.icon{font-size:42px;margin-bottom:8px}.muted{color:#68736b;line-height:1.5}.btn{display:inline-block;margin-top:18px;background:#183c2b;color:#fff;text-decoration:none;padding:13px 18px;border-radius:12px;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Verificando o pedido…</h1>
    <p class="muted" id="message">Você será informado pelo Mercado Pago sobre o status do pagamento.</p>
    <a class="btn" href="index.html">Voltar para a loja</a>
  </main>
  <script>
    const q=new URLSearchParams(location.search),status=q.get('status');
    const icon=document.getElementById('icon'),title=document.getElementById('title'),message=document.getElementById('message');
    if(status==='success'){icon.textContent='✅';title.textContent='Pagamento aprovado';message.textContent='O Mercado Pago informou que o pagamento foi aprovado. A loja poderá confirmar os próximos passos.';}
    else if(status==='pending'){icon.textContent='🕒';title.textContent='Pagamento pendente';message.textContent='O pagamento ainda está sendo processado. Aguarde a atualização do Mercado Pago.';}
    else if(status==='failure'){icon.textContent='⚠️';title.textContent='Pagamento não concluído';message.textContent='O pagamento não foi concluído. Você pode voltar à loja e tentar novamente.';}
    else {icon.textContent='ℹ️';title.textContent='Status do pedido';}
  </script>
</body>
</html>
